<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tosca Parfume</title>
  <meta name="description" content="Tosca Parfume: designer and niche fragrances, ordered through WhatsApp.">
  <meta name="theme-color" content="#202020">
  <link rel="icon" href="images/logo.jpg" type="image/jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Full-Screen Loader -->
  <div id="page-loader">
    <div class="loader-circle"></div>
    <img src="images/h-logo.png" alt="Tosca Parfume" class="loader-logo">
  </div>

  <header id="header">
    <a class="brand" href="#" aria-label="Tosca Parfume">
      <img src="images/h-logo.png" alt="" id="h-logo">
      <span class="wordmark">TOSCA<span>PARFUME</span></span>
    </a>

    <div class="lang-switcher" role="group" aria-label="Language">
      <button class="lang-btn active" data-lang="en" aria-pressed="true">EN</button>
      <button class="lang-btn" data-lang="sq" aria-pressed="false">AL</button>
      <button class="lang-btn" data-lang="mk" aria-pressed="false">MK</button>
    </div>
  </header>

  <main>
    <!-- Banner -->
    <div class="hero">
      <img src="images/banner.webp" alt="Tosca Parfume" id="banner" width="1024" height="558">
    </div>

    <div id="toolbar">
      <!-- Search -->
      <div class="search-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
        <label for="search-bar" class="visually-hidden" data-i18n="searchLabel">Search perfumes and brands</label>
        <input type="search" id="search-bar" placeholder="Search perfumes and brands" autocomplete="off">
      </div>

      <!-- Filter -->
      <div class="filter-row">
        <div id="quick-filters-container">
          <button class="filter-pill active" data-key="gender" data-value="all" data-i18n="all">All</button>
          <button class="filter-pill" data-key="gender" data-value="burra" data-i18n="men">Men</button>
          <button class="filter-pill" data-key="gender" data-value="gra" data-i18n="women">Women</button>
          <button class="filter-pill" data-key="gender" data-value="unisex" data-i18n="unisex">Unisex</button>
        </div>
        <button id="btn-open-filters" class="filter-pill advanced-btn" aria-haspopup="dialog">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
          <span data-i18n="filters">Filters</span>
        </button>
      </div>
    </div>

    <p id="result-count" class="result-count" aria-live="polite"></p>

    <!-- Advanced Filter Bottom Sheet -->
    <div id="filter-overlay" class="hidden"></div>
    <div id="advanced-filters" class="bottom-sheet hidden" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-header">
        <h3 id="sheet-title" data-i18n="advTitle">Advanced Filters</h3>
        <button id="btn-close-filters" aria-label="Close">&times;</button>
      </div>

      <div class="sheet-body">
        <div class="filter-group">
          <label for="brand-select" data-i18n="brand">Brand</label>
          <select id="brand-select"></select>
        </div>

        <div class="filter-group">
          <label for="price-slider"><span data-i18n="maxPrice">Max Price</span>: <span id="price-display">MKD 4,500</span></label>
          <input type="range" id="price-slider" min="1600" max="4500" step="100" value="4500">
        </div>

        <div class="filter-group">
          <label for="sort-select" data-i18n="sortBy">Sort By</label>
          <select id="sort-select">
            <option value="default" data-i18n="sortDefault">Default (Newest)</option>
            <option value="price-asc" data-i18n="sortAsc">Price: Low to High</option>
            <option value="price-desc" data-i18n="sortDesc">Price: High to Low</option>
          </select>
        </div>
      </div>

      <div class="sheet-footer">
        <button id="btn-apply-filters" class="btn-primary" data-i18n="apply">Apply Filters</button>
      </div>
    </div>

    <!-- Catalog -->
    <div id="catalog"></div>
  </main>

  <!-- Footer -->
  <footer id="footer">
    <p>&copy; 2026 Tosca Parfume. All rights reserved.<br>
       Website built by <a href="https://www.instagram.com/kasio_it/" target="_blank" rel="noopener noreferrer" class="agency-link">Kasio IT</a></p>
  </footer>

  <!-- WhatsApp Icon -->
  <a href="https://wa.me/38978204889?text=P%C3%ABrsh%C3%ABndetje!" class="whatsapp-float"
    target="_blank" rel="noopener noreferrer"
    aria-label="Contact us on WhatsApp">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true">
          <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/>
      </svg>
  </a>

  <!-- Back to top -->
  <button id="scroll-top-btn" aria-label="Back to top">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M18 15l-6-6-6 6"/>
    </svg>
  </button>
  <script src="script.js"></script>
</body>
</html>
