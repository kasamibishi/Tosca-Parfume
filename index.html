<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tosca Parfume</title>
  <link rel="shortcut icon" href="images/IMG-20260731-WA0000.jpg" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
  <link rel="shortcut icon" href="images/logo.jpg" type="image/x-icon">
</head>
<body>
  <!-- Full-Screen Loader -->
  <div id="page-loader">
    <div class="loader-circle"></div>
    <img src="images/h-logo.png" alt="Tosca Parfume" class="loader-logo">
  </div>

  <header id="header">
  <img src="images/h-logo.png" alt="Tosca Parfume" id="h-logo">
  
  <div class="lang-switcher">
    <button class="lang-btn active" data-lang="en">EN</button>
    <button class="lang-btn" data-lang="sq">AL</button>
    <button class="lang-btn" data-lang="mk">MK</button>
  </div>
</header>
  
  <!--Banner-->
  <img src="images/banner.webp" alt="" id="banner">

  <!--Search Bar-->
  <input type="text" id="search-bar" placeholder="Search perfumes and brands">

  <!-- Filter -->
  <div id="quick-filters-container">
    <button class="filter-pill active" data-key="gender" data-value="all">All</button>
    <button class="filter-pill" data-key="gender" data-value="burra">Men</button>
    <button class="filter-pill" data-key="gender" data-value="gra">Women</button>
    <button class="filter-pill" data-key="gender" data-value="unisex">Unisex</button>
    <button id="btn-open-filters" class="filter-pill advanced-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
      Filters
    </button>
  </div>

  <!-- Advanced Filter Bottom Sheet -->
  <div id="filter-overlay" class="hidden"></div>
  <div id="advanced-filters" class="bottom-sheet hidden">
    <div class="sheet-header">
      <h3>Advanced Filters</h3>
      <button id="btn-close-filters">&times;</button>
    </div>
    
    <div class="sheet-body">
      <!-- Brand Filter -->
      <div class="filter-group">
        <label>Brand</label>
        <select id="brand-select">
          <option value="all">All Brands</option>
          <option value="tom ford">Tom Ford</option>
          <option value="xerjoff">Xerjoff</option>
          <option value="giorgio armani">Giorgio Armani</option>
          <option value="jean paul gaultier">Jean Paul Gaultier</option>
          <!-- Add rest of brands here -->
        </select>
      </div>

      <!-- Price Filter -->
      <div class="filter-group">
        <label>Max Price: <span id="price-display">MKD 4500</span></label>
        <!-- Range: 1600 to 4500 based on your current catalog -->
        <input type="range" id="price-slider" min="1600" max="4500" step="100" value="4500">
      </div>
    </div>
    
    <div class="sheet-footer">
      <button id="btn-apply-filters" class="btn-primary">Apply Filters</button>
    </div>
  </div>

  <!--Catalog-->
  <div id="catalog">
    
  </div>

  <!-- Footer -->
  <footer id="footer">
    <p>&copy; 2026 Tosca Parfume. All rights reserved.<br>
       Website built by <a href="https://www.instagram.com/kasio_it/" target="_blank" rel="noopener noreferrer" class="agency-link">Kasio IT</a></p>
  </footer>

  <!--WhatsApp Icon-->
  <a href="https://wa.me/38978204889?text=P%C3%ABrsh%C3%ABndetje!" class="whatsapp-float" 
    target="_blank" 
    aria-label="Contact us on WhatsApp">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="#FFFFFF">
          <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/>
      </svg>
  </a>

  <!--Back Icon-->
  <button id="scroll-top-btn" aria-label="Kthehu lart">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 15l-6-6-6 6"/>
    </svg>
  </button>
  <script src="script.js"></script>
</body>
</html>
